server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Using $backend_upstream (a variable) instead of
    # a bare hostname in proxy_pass forces nginx to re-resolve "backend" on
    # every request (respecting this TTL) instead of caching the IP forever
    # — without this, recreating the backend container (new IP each time)
    # leaves nginx stuck retrying the old, now-dead IP ("Host is unreachable")
    # until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    # REST API — same-origin proxy to the backend container.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — needs the Upgrade/Connection headers for the WebSocket
    # transport; falls back to long-polling automatically if that fails.
    location /socket.io/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Uploaded files served by the backend (chat attachments, avatars, etc.)
    location /uploads/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # SPA — client-side routing, fall back to index.html for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
