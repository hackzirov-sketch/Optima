# Own project name: the default comes from the directory ("backend"), which
# another project on this machine also uses — `docker compose down` there
# removed these containers too. Volume names stay pinned to the existing
# backend_* volumes so the data carries over.
name: upz

services:
#  app:
#    build:
#      context: .
#      dockerfile: Dockerfile
#      # "deps" is the first stage — full `npm ci` including devDependencies
#      # (@nestjs/cli, ts-node, etc.), no compiled source. Source comes from
#      # the bind mount below instead, so `npm run dev` (nest start --watch)
#      # can hot-reload; the production image build (`docker build` with no
#      # --target, or the root docker-compose.yml) still uses the full
#      # multi-stage Dockerfile as before.
#      target: deps
#    container_name: upz-backend-app
#    ports:
#      - "8080:8080"
#    env_file:
#      - .env
#    environment:
#      PORT: 8080
#      # Point at the local containers below rather than whatever
#      # DATABASE_URL/REDIS_URL happen to be in .env (e.g. a cloud DB used
#      # for host-side `npm run dev`) — override always wins over env_file.
#      DATABASE_URL: postgresql://app:secret@postgres:5432/upz
#      REDIS_URL: redis://redis:6379
#    volumes:
#      - .:/app
#      - /app/node_modules
#    command: npm run dev
#    depends_on:
#      - postgres
#      - redis

  postgres:
    image: postgres:18-alpine
    container_name: upz-backend-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backup: a second Postgres holding a copy of the primary ──────────────
  # db-backup pg_dumps the primary every BACKUP_INTERVAL_HOURS, restores it
  # into postgres-backup (swapped in only once fully restored) and keeps the
  # dump files for BACKUP_KEEP_DAYS in the db_backups volume. See
  # backend/docker/backup/backup.sh; restore.sh loads a dump back.
  postgres-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BACKUP_POSTGRES_USER:-backup}
      POSTGRES_PASSWORD: ${BACKUP_POSTGRES_PASSWORD:-backup}
      POSTGRES_DB: postgres
    volumes:
      - postgres_backup_data:/var/lib/postgresql
    # Loopback only — for inspecting or exporting the copy from the host.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKUP_POSTGRES_USER:-backup} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    # Same major version as the primary: pg_dump must not be older than the server.
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-backup:
        condition: service_healthy
    environment:
      SOURCE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKUP_PGHOST: postgres-backup
      BACKUP_PGUSER: ${BACKUP_POSTGRES_USER:-backup}
      BACKUP_PGPASSWORD: ${BACKUP_POSTGRES_PASSWORD}
      BACKUP_PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/backup/restore.sh:/usr/local/bin/restore.sh:ro
      - db_backups:/backups
    # Unhealthy once no backup has succeeded for two intervals (+1h slack).
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/LAST_SUCCESS && [ $$(( $$(date +%s) - $$(cat /backups/LAST_SUCCESS) )) -lt $$(( (${BACKUP_INTERVAL_HOURS:-6} * 2 + 1) * 3600 )) ]"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 15m

  redis:
    image: redis:7-alpine
    container_name: upz-backend-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    name: backend_postgres_data
  postgres_backup_data:
    name: backend_postgres_backup_data
  db_backups:
    name: backend_db_backups
  redis_data:
    name: backend_redis_data
