#    env_file:
#      - .env
#    environment:
#      PORT: 8080
#      # Point at the local containers below rather than whatever
#      # DATABASE_URL/REDIS_URL happen to be in .env (e.g. a cloud DB used
#      # for host-side `npm run dev`) — override always wins over env_file.
#      DATABASE_URL: postgresql://app:secret@postgres:5432/upz
