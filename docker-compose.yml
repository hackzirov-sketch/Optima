  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped

    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=${TURN_REALM:-upz.local}
      - --user=${TURN_USERNAME:-upzturn}:${TURN_CREDENTIAL:?TURN_CREDENTIAL is required}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint

    # Host networking so the wide relay port range doesn't need a per-port
    # docker mapping — coturn's srflx/relay candidates must carry the
    # server's real reachable address, which host mode gives directly.
    # NOTE: this only makes calls work across different networks/NAT if
    # this host itself has a public IP (or the relevant UDP range is
    # port-forwarded to it) and TURN_PUBLIC_HOST below points at that
    # address — on a home/office machine behind a router with no port
    # forwarding, coturn here only helps peers already on the same LAN.
    network_mode: host

