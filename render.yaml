services:
  - type: web
    name: optima
    runtime: node
    plan: free
    healthCheckPath: /
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/upz-landing run build
    startCommand: node artifacts/upz-landing/server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
