services:
  - type: web
    name: optima
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/upz-landing run build
    startCommand: pnpm --filter @workspace/upz-landing run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BASE_PATH
        value: /
