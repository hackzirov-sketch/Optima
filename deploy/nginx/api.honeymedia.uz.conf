# /etc/nginx/sites-available/api.honeymedia.uz  (symlink into sites-enabled)
#
# The NestJS API and its Socket.IO endpoint behind one host. Socket.IO needs
# the WebSocket upgrade handshake forwarded: without `Upgrade`/`Connection`
# the backend sees a plain GET on ?transport=websocket and answers
# 400 {"code":3,"message":"Bad request"} — the browser then reports
# "can't establish a connection to wss://…/socket.io/".

# "Upgrade" when the client asks for it, otherwise a normal keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream optima_api {
    server 127.0.0.1:8080;   # backend PORT
    keepalive 32;
}

server {
    listen 80;
    server_name api.honeymedia.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.honeymedia.uz;

    ssl_certificate     /etc/letsencrypt/live/api.honeymedia.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.honeymedia.uz/privkey.pem;

    # Uploads go through the API (chat files, avatars, recordings).
    client_max_body_size 100m;

    # ── Socket.IO: WebSocket upgrade + long-polling fallback ──
    location /socket.io/ {
        proxy_pass http://optima_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A socket is idle between messages; nginx's default 60s would cut it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://optima_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
